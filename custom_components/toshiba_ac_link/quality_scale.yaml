# The state of each rule of the Integration Quality Scale, as assessed by this project.
# Tiers are assigned to integrations in Home Assistant core, so this claims no official tier.
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: Updates are pushed. The client fetches the state of all units every 30 minutes and energy every hour, and Home Assistant does not poll.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
  # Silver
  action-exceptions:
    status: done
    comment: A refused or failed command, a block, a rejected token, and a mode or status the unit lacks raise HomeAssistantError, and reconnect raises it if an entry does not load. Tests cover each through real actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: 99 percent in total and at least 97 in each module, measured with pytest-cov. CI fails below 95 in total.
  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: The units only talk to the Toshiba cloud, so there is nothing on the network to discover.
  discovery-update-info:
    status: exempt
    comment: The units only talk to the Toshiba cloud, so there is nothing on the network to discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: A unit added to the account appears by itself after the next list of units, within about 30 minutes, and the user does nothing. The integration reloads its own entry for this, so the entities of the account are unavailable for a moment. The example of the rule adds entities without a reload, and the rule does not require that mechanism.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: The indoor temperature sensor starts disabled on new units, because the climate entity shows the same value. A test shows that a sensor already in the registry stays enabled.
  entity-translations: done
  exception-translations:
    status: done
    comment: Every error raised to a user has a translation key in four languages, and tests check the keys through real actions and a real setup. The pylint checks of the rule only run in core.
  icon-translations: done
  reconfiguration-flow:
    status: done
    comment: The form corrects the username and password of the same account, and refuses another one. The rule exempts integrations whose only settings are credentials that reauthentication handles, but reauthentication here cannot change the username.
  repair-issues:
    status: exempt
    comment: Nothing needs a repair. A rejected token uses reauthentication, and a block ends by itself.
  stale-devices:
    status: done
    comment: A unit missing from two lists in a row is removed, unless a list is empty or holds a unit that cannot be read. async_remove_config_entry_device allows deleting one sooner.
  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing:
    status: done
    comment: CI runs mypy in strict mode. The .strict-typing file of the rule only exists in core.
